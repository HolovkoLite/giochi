<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Somiglianze</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,400..900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' fill='%23123A31'/%3E%3Crect x='6' y='4' width='20' height='29' fill='%23F4EFE4' stroke='%230A241E' stroke-width='2.5'/%3E%3Crect x='16' y='20' width='27' height='20' fill='%23FF6B3D' stroke='%230A241E' stroke-width='2.5'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#123A31; --ink:#0A241E; --ink2:#0D2A23; --paper:#F4EFE4; --white:#FFFDF7;
  --or:#FF6B3D; --ordk:#C2461F; --gr:#1F5E4E; --mu:#B5CBC3; --li:#5F877C; --slot:#2C5A4F; --tx2:#43574F;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--paper);font-family:'Anybody',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
:focus-visible{outline:3px dashed var(--paper);outline-offset:4px}
.mono{font-family:'DM Mono',ui-monospace,monospace}
.or{color:var(--or)}
.title{font-weight:900;font-stretch:62%;letter-spacing:.5px;text-shadow:3px 3px 0 var(--or);line-height:1}
.dots{background-color:var(--gr);background-image:radial-gradient(var(--or) 1.6px,transparent 1.8px);background-size:9px 9px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* pulsanti */
.btn{min-height:48px;padding:0 18px;border:3px solid var(--ink);background:var(--paper);color:var(--ink2);font-weight:800;font-stretch:85%;font-size:18px;box-shadow:5px 5px 0 var(--or);display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none}
.btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:2px 2px 0 var(--or)}
.btn.or{background:var(--or);box-shadow:5px 5px 0 var(--ink)}
.btn.or:active:not(:disabled){box-shadow:2px 2px 0 var(--ink)}
.btn.ink{box-shadow:5px 5px 0 var(--ink)}
.btn.ghost{background:transparent;color:var(--paper);border-color:var(--paper);box-shadow:none}
.btn.sm{min-height:44px;font-size:16px;padding:0 14px}
.btn:disabled{background:transparent;border-color:var(--li);color:var(--mu);box-shadow:none}
.btn:disabled svg rect{stroke:var(--mu)}
.lnk{background:none;border:none;padding:6px 0;color:inherit;text-decoration:underline;text-underline-offset:3px;font-size:16px;min-height:44px}

/* pagine (home, mazzi) */
.page{max-width:1100px;margin:0 auto;padding:28px 22px 70px}
.ph{display:flex;align-items:center;gap:14px;margin-bottom:28px;flex-wrap:wrap}
.ph .title{font-size:44px}
.ph .back{margin-left:auto}
.homegrid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:30px;align-items:start}
@media (max-width:880px){.homegrid{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:30px}
.panel{background:var(--paper);color:var(--ink2);border:3px solid var(--ink);box-shadow:7px 7px 0 var(--ink);padding:22px 22px 24px}
.panel h2{margin:0 0 6px;font-weight:850;font-stretch:72%;font-size:32px;line-height:1.05}
.panel h3{margin:18px 0 8px;font-weight:800;font-stretch:80%;font-size:21px}
.panel p{margin:6px 0 12px;font-size:17px;line-height:1.4}
.muted{color:var(--tx2)}
.step{display:flex;align-items:center;gap:10px;font-weight:800;font-stretch:80%;font-size:21px;margin:22px 0 10px}
.stepn{width:30px;height:30px;flex:none;background:var(--ink2);color:var(--or);display:flex;align-items:center;justify-content:center;font-size:15px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.opt{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:3px;text-align:left;border:3px solid var(--ink);background:var(--white);color:var(--ink2);padding:12px 14px;min-height:64px}
.opt b{font-weight:800;font-stretch:85%;font-size:19px;line-height:1.1}
.opt small{font-size:15px;color:var(--tx2);line-height:1.3}
.opt[aria-pressed="true"]{background:var(--or);box-shadow:4px 4px 0 var(--ink)}
.opt[aria-pressed="true"] small{color:var(--ink2)}
.opt:disabled{opacity:.5}
.decklist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.decklist{grid-template-columns:1fr}}
.warn{color:var(--ordk);font-weight:700}
.msg{margin-top:14px;padding:10px 12px;border:3px solid var(--ink);background:var(--ink2);color:var(--paper);font-size:16px;line-height:1.35}
.msg.ok{background:var(--gr)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row > .grow{flex:1;min-width:180px}
label.fl{display:block;font-weight:700;font-stretch:90%;font-size:16px;margin:0 0 6px}
input[type=text],input[type=url],input[type=search],textarea{font:inherit;font-size:17px;border:3px solid var(--ink);background:var(--white);color:var(--ink2);padding:10px 12px;min-height:48px;width:100%;border-radius:0}
input.code{font-family:'DM Mono',monospace;font-size:26px;letter-spacing:6px;max-width:220px}
textarea{min-height:120px;font-family:'DM Mono',monospace;font-size:14px}
pre.rules{background:var(--ink2);color:var(--paper);padding:12px;font-size:13px;overflow:auto;margin:8px 0 10px}
ol.steps{margin:6px 0 12px;padding-left:22px;font-size:16px;line-height:1.45}
details > summary{cursor:pointer;font-weight:850;font-stretch:72%;font-size:28px;list-style:none;min-height:44px}
details > summary::-webkit-details-marker{display:none}
details > summary::after{content:' +';color:var(--ordk)}
details[open] > summary::after{content:' −'}

/* mazzi */
.dk{display:flex;flex-direction:column;gap:12px}
.dkrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 16px;border:3px solid var(--ink);background:var(--white)}
.dkrow .nm2{flex:1;min-width:180px;font-weight:800;font-stretch:85%;font-size:21px}
.dkrow .nm2 small{display:block;font-family:'DM Mono',monospace;font-weight:400;font-size:14px;color:var(--tx2);margin-top:2px}
.cardrows{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.crow{display:grid;grid-template-columns:38px 56px minmax(0,1.2fr) minmax(0,1fr) auto auto;gap:10px;align-items:center}
@media (max-width:720px){.crow{grid-template-columns:30px 48px minmax(0,1fr) auto auto}.crow .curl{order:9;grid-column:1 / -1}}
.crow .idx{font-family:'DM Mono',monospace;font-size:14px;color:var(--tx2)}
.thumb{width:56px;height:56px;border:3px solid var(--ink);background:var(--paper) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:11px;color:var(--tx2)}
.iconbtn{min-width:44px;min-height:44px;border:3px solid var(--ink);background:var(--white);color:var(--ink2);display:inline-flex;align-items:center;justify-content:center;padding:0 10px;font-size:15px}
.addbox{border:3px dashed var(--ink);padding:14px;margin-top:14px;background:var(--white)}

/* LIM */
.limwrap{position:fixed;inset:0;background:var(--bg);overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;padding:28px 40px 36px;display:flex;flex-direction:column;gap:18px}
.lhead{display:flex;align-items:center;gap:36px;height:52px;flex:none}
.lhl{flex:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;align-items:center;padding-right:6px;min-width:0}
.lhl .brand{grid-column:1 / span 3;display:flex;align-items:center;gap:14px}
.lhl .brand .title{font-size:40px}
.lhl .clr{grid-column:4;display:flex}
.clearbtn{min-height:44px;width:100%;padding:0 8px;border:2px solid var(--paper);background:transparent;color:var(--paper);font-size:14px;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:7px}
.lhr{width:330px;flex:none;display:flex;align-items:center;justify-content:flex-end;gap:12px}
.chipc{height:44px;padding:0 12px;border:2px solid var(--paper);display:flex;align-items:center;gap:8px;font-size:15px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--li)}
.dot.on{background:var(--or)}
.menubtn{min-height:44px;padding:0 16px;border:none;background:var(--paper);color:var(--ink2);font-size:16px}
.lmain{flex:1;display:flex;gap:36px;min-height:0}
.lgrid{flex:1;position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:18px 16px;padding:0 6px 6px 0;min-height:0;min-width:0}
.card{position:relative;border:3px solid var(--ink);background:var(--paper);color:var(--ink2);box-shadow:5px 5px 0 var(--ink);padding:34px 14px 12px;display:flex;flex-direction:column;text-align:left;min-width:0;min-height:0;overflow:hidden}
.card:disabled{opacity:1}
.card.sel{background:var(--or);transform:rotate(-2deg);box-shadow:6px 6px 0 var(--ink)}
.card.hit{background:var(--or)}
.cnum{position:absolute;top:9px;left:12px;font-family:'DM Mono',monospace;font-size:14px;font-weight:500;color:var(--ordk)}
.card.sel .cnum{color:var(--ink2)}
.stamp{position:absolute;top:8px;right:8px;width:50px;height:50px;border-radius:50%;background:var(--ink2);color:var(--or);font-family:'DM Mono',monospace;font-size:13px;font-weight:500;display:flex;align-items:center;justify-content:center;transform:rotate(10deg);z-index:2}
.tag{position:absolute;top:9px;left:10px;background:var(--ink2);color:var(--or);font-family:'DM Mono',monospace;font-size:13px;font-weight:500;padding:3px 8px;z-index:2}
.cbody{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:7px;min-height:0;width:100%}
.cimg{flex:1 1 auto;min-height:36px;width:100%;object-fit:cover;border:2px solid var(--ink);background:var(--white);display:block}
.nm{display:block;font-weight:760;line-height:1.03;hyphens:manual;overflow-wrap:normal;word-break:normal;flex:none}
.nm.brk{hyphens:auto;-webkit-hyphens:auto;overflow-wrap:anywhere}
.cardout{border:3px solid var(--ink);display:flex;align-items:flex-end;padding:10px 12px;min-width:0}
.cardout span{background:var(--ink);color:var(--paper);font-size:13px;padding:3px 7px}
.laside{width:330px;flex:none;display:flex;flex-direction:column;gap:14px;min-height:0}
.turn{display:flex;justify-content:space-between;align-items:center;height:40px}
.turn b{font-weight:800;font-size:24px;font-stretch:75%}
.sqs{display:flex;gap:5px}
.sq{width:14px;height:14px;border:2px solid var(--li)}
.sq.done{background:var(--paper);border-color:var(--paper)}
.sq.cur{width:30px;background:var(--or);border-color:var(--or)}
.cluebox{background:var(--ink);padding:12px 18px 14px;display:flex;flex-direction:column;align-items:center;gap:10px}
.cluebox .lbl{font-size:14px;color:var(--mu)}
.cc{background:var(--paper);color:var(--ink2);border:3px solid var(--ink);padding:10px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;box-shadow:6px 6px 0 var(--or);overflow:hidden}
.cc.v{width:110px;height:154px}
.cc.h{width:154px;height:110px}
.cc .cimg{min-height:24px}
.slotc{width:110px;height:154px;border:2px dashed var(--li);display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;color:var(--mu);padding:10px}
.kchip{background:var(--or);color:var(--ink2);font-size:15px;font-weight:500;padding:5px 12px}
.prev{display:flex;flex-direction:column;gap:8px}
.prev .lbl{font-size:14px;color:var(--mu)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:30px;max-width:100%;padding:3px 9px;background:var(--paper);color:var(--ink2);border:2px solid var(--ink);display:flex;align-items:center;gap:7px;font-weight:700;font-stretch:85%;font-size:14px;line-height:1.1}
.chip svg{flex:none}
.lfoot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.big{font-weight:850;font-size:40px;font-stretch:70%;line-height:1}
.big.sm{font-size:34px}
.hint{font-size:14px;color:var(--mu)}
.slots{display:grid;gap:6px;margin-top:4px}
.slots span{height:12px;background:var(--slot)}
.slots span.f{background:var(--or)}
.slots span.s{background:var(--paper)}
.endb{display:flex;gap:12px;margin-top:8px}
.wait{position:absolute;inset:0 6px 6px 0;background:rgba(10,36,30,.86);display:flex;align-items:center;justify-content:center;z-index:5}
.waitbox{background:var(--paper);color:var(--ink2);border:3px solid var(--ink);box-shadow:8px 8px 0 var(--or);padding:24px 28px;display:flex;gap:28px;align-items:center;max-width:720px}
.waitbox h3{margin:0 0 8px;font-weight:850;font-stretch:72%;font-size:34px}
.waitbox ol{margin:0 0 12px;padding-left:22px;font-size:18px;line-height:1.45}
.bigcode{font-family:'DM Mono',monospace;font-size:44px;letter-spacing:8px;font-weight:500}
.qr{width:170px;height:170px;flex:none;background:var(--white);border:3px solid var(--ink);display:flex;align-items:center;justify-content:center}
.qr svg{width:100%;height:100%;display:block}
.qr.sm{width:120px;height:120px}

/* suggeritore */
.sg{max-width:540px;margin:0 auto;padding:22px 20px 40px;display:flex;flex-direction:column;gap:18px}
.sghead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sghead .title{font-size:28px;text-shadow:2px 2px 0 var(--or)}
.sgstat{font-size:14px;color:var(--mu);display:flex;align-items:center;gap:8px}
.secret{background:var(--or);color:var(--ink2);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:14px 16px 16px;display:flex;gap:14px;align-items:center;margin-right:6px}
.secret .simg{width:76px;height:76px;flex:none;object-fit:cover;border:2px solid var(--ink);background:var(--white)}
.secret .lbl{font-size:14px;font-weight:500}
.secret .snm{display:block;font-weight:760;line-height:1.02;font-size:38px;font-stretch:85%;hyphens:auto;overflow-wrap:break-word;margin-top:6px}
.sect{font-size:14px;color:var(--mu)}
.hand{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding-right:6px}
.hcard{position:relative;height:96px;border:3px solid var(--ink);background:var(--paper);color:var(--ink2);padding:8px 10px;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;box-shadow:4px 4px 0 var(--ink);overflow:hidden}
.hcard[aria-pressed="true"]{box-shadow:5px 5px 0 var(--or);transform:rotate(-1.5deg);outline:3px solid var(--or);outline-offset:2px}
.hcard.wimg{height:156px}
.hcard .cimg{flex:1 1 auto;min-height:40px}
.hinfo{min-height:96px;border:2px dashed var(--li);color:var(--mu);font-size:13px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px}
.kinds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding-right:6px}
.kind{min-height:96px;flex-direction:column;gap:6px;font-size:21px}
.sbox{background:var(--ink);padding:16px;display:flex;flex-direction:column;gap:6px}
.mboard{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.mc{position:relative;height:70px;border:2px solid var(--ink);background:var(--paper);color:var(--ink2);padding:18px 6px 5px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;min-width:0}
.mc .mn{position:absolute;top:3px;left:5px;font-family:'DM Mono',monospace;font-size:11px;color:var(--ordk)}
.mc.sel{background:var(--or)}
.mc.dots{background-color:var(--gr);background-image:radial-gradient(var(--or) 1.4px,transparent 1.6px);background-size:7px 7px}
.mc.sel .mn{color:var(--ink2)}
.mc.sec{outline:3px solid var(--or);outline-offset:-1px}
.mc.sec .mn{color:var(--ink2);background:var(--or);padding:0 4px;left:0;top:0}
.mc.out{padding:5px}
.mc.out .mn{color:var(--paper);background:var(--ink);padding:0 4px;left:3px;top:auto;bottom:3px}
.mc .nm{font-size:13px;font-weight:700}
.banner{background:var(--paper);color:var(--ink2);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--or);padding:14px 16px;display:flex;gap:14px;align-items:center}
.banner p{margin:0 0 6px;font-size:16px;line-height:1.35}
.sgfoot{display:flex;justify-content:center;margin-top:8px}

/* menu */
.modal{position:fixed;inset:0;background:rgba(10,36,30,.8);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modalbox{background:var(--paper);color:var(--ink2);border:3px solid var(--ink);box-shadow:8px 8px 0 var(--or);padding:22px 24px;max-width:620px;width:100%;max-height:92vh;overflow:auto}
.modalbox h2{margin:0 0 10px;font-weight:850;font-stretch:72%;font-size:32px}
.modalbox ul{padding-left:20px;font-size:17px;line-height:1.45;margin:0 0 16px}
.modalbox .row{margin-top:10px}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}

/* v1.1 */
.badge{display:inline-block;font-family:'DM Mono',monospace;font-size:12px;font-weight:500;background:var(--ink2);color:var(--paper);padding:2px 7px;margin:4px 6px 0 0;line-height:1.4;font-stretch:100%}
.badge.or{background:var(--or);color:var(--ink2)}
.soon{display:inline-block;font-family:'DM Mono',monospace;font-size:12px;background:var(--ink2);color:var(--or);padding:2px 7px;margin-top:4px}
.empty{border:3px dashed var(--ink);padding:16px 16px 6px;background:var(--white)}
.empty p{margin:0 0 12px}
.chk{display:flex;gap:10px;align-items:center;font-size:16px;margin-top:10px;min-height:44px;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--ordk);flex:none}
.danger{margin-top:28px;border-top:3px dashed var(--ink);padding-top:16px}
.note{border:3px solid var(--ink);background:var(--white);padding:12px 14px;margin:12px 0;font-size:16px;line-height:1.4}
.foot{margin-top:36px;display:flex;justify-content:center;gap:6px;align-items:center;flex-wrap:wrap;color:var(--mu);font-size:14px}
.foot .lnk{color:var(--mu);font-size:14px}
.guide h2{font-size:40px;margin-bottom:12px}
.gsec{margin-top:28px}
.gsec h3{font-size:25px;margin:0 0 8px}
.gsec p,.gsec li{font-size:17px;line-height:1.5}
.gsec ul,.gsec ol{padding-left:22px;margin:6px 0 12px}
kbd{font-family:'DM Mono',monospace;font-size:14px;border:2px solid var(--ink);background:var(--white);padding:0 5px}
.toc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.toc .lnk{font-size:15px;min-height:36px}
.gsec li .lnk{min-height:0;padding:0;font-size:inherit}
.side h2{font-size:26px}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
/* =====================================================================
   SOMIGLIANZE · versione 1.1
   Strumento didattico gratuito e senza scopo di lucro, ispirato alle
   meccaniche del gioco da tavolo Similo (Horrible Guild). Non è affiliato
   né approvato dall'editore. Tutti i marchi appartengono ai rispettivi
   proprietari.
   ---------------------------------------------------------------------
   MODALITÀ «DUE DISPOSITIVI» (in arrivo, per ora disattivata)
   Per attivarla: MULTI_DEVICE = true e incolla in FIREBASE_CONFIG
   l'oggetto firebaseConfig della console Firebase (deve contenere
   databaseURL). Regole da pubblicare nel Realtime Database:
   {
     "rules": {
       "rooms": {
         ".read": "query.orderByChild === 'createdAt' && query.endAt <= now - 2592000000",
         ".indexOn": ["createdAt"],
         "$code": { ".read": true, ".write": true, ".validate": "$code.matches(/^[0-9]{5}$/)" }
       }
     }
   }
   ===================================================================== */
const VERSION = '1.1';
const MULTI_DEVICE = false;
const FIREBASE_CONFIG = null;

const FIREBASE_VERSION = '13.4.0';
const NEED = [1, 2, 3, 4, 1];
const MIN_CARDS = 21;
const LS_DECKS = 'somiglianze.mazzi', SS_DECKS = 'somiglianze.mazziLezione', LS_PREF = 'somiglianze.preferenze';
const LS_LOCAL = 'somiglianze.partitaLocale', SS_SES = 'somiglianze.sessione';
const ROOM_DAYS = 30, LOCAL_MAX_HOURS = 12;
const FILE_ACCEPT = '.csv,.tsv,.txt,.xlsx,.xlsm,.xls,.ods';

const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const zeros = () => Array(12).fill(0);
const rnd = n => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; };
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const uid = () => Date.now().toString(36) + rnd(1e6).toString(36);
const arr = x => Array.isArray(x) ? x.filter(v => v != null) : (x && typeof x === 'object') ? Object.keys(x).sort((a, b) => a - b).map(k => x[k]).filter(v => v != null) : [];
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
const lsSet = (k, v) => { localStorage.setItem(k, JSON.stringify(v)); };

function driveFix(u) {
  const m = u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=|thumbnail\?id=)([\w-]{10,})/);
  return m ? `https://drive.google.com/thumbnail?id=${m[1]}&sz=w800` : u;
}
function safeImg(u) {
  u = String(u || '').trim();
  if (/^data:image\/(png|jpe?g|gif|webp);base64,[a-z0-9+/=]+$/i.test(u)) return u;
  if (/^https?:\/\/[^\s"'<>]+$/i.test(u)) return driveFix(u);
  return '';
}
const clean = c => { const o = { n: String(c.n || '').trim() }; const im = safeImg(c.img); if (im) o.img = im; return o; };

/* codifica della carta segreta: non è una protezione vera, evita solo che si legga a colpo d'occhio */
const encS = i => { const s = 101 + rnd(8000); return (s * 17 + i).toString(36) + '-' + s.toString(36); };
const decS = x => { if (!x) return -1; const [a, b] = String(x).split('-'); return parseInt(a, 36) - parseInt(b, 36) * 17; };

/* dimensione del nome in base alla lunghezza; poi fitAll() rifinisce misurando */
function fitInit(n, k = 1) {
  const L = n.length, W = Math.max(...n.split(/\s+/).map(w => w.length));
  let fs = L <= 10 ? 34 : L <= 14 ? 30 : L <= 18 ? 27 : 25;
  let w = L <= 10 ? 100 : L <= 14 ? 88 : L <= 18 ? 78 : 70;
  if (W >= 10) w = Math.min(w, 72);
  return { fs: Math.round(fs * k), w };
}
function nameSpan(n, k = 1) {
  const f = fitInit(n, k);
  return `<span class="nm fit" style="font-size:${f.fs}px;font-stretch:${f.w}%">${esc(n)}</span>`;
}
function fitAll() {
  document.querySelectorAll('[data-fit]').forEach(box => {
    const el = box.querySelector('.fit'); if (!el) return;
    let fs = parseFloat(el.style.fontSize) || 20, g = 0;
    const over = () => box.scrollHeight > box.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1;
    while (over() && fs > 11 && g++ < 60) { fs -= 1; el.style.fontSize = fs + 'px'; }
    if (over()) el.classList.add('brk');
  });
}

/* ---------- Firebase ---------- */
function fbConfig() {
  return MULTI_DEVICE && FIREBASE_CONFIG && FIREBASE_CONFIG.databaseURL ? { cfg: FIREBASE_CONFIG, from: 'file' } : null;
}
let FB = null;
async function fb() {
  if (FB) return FB;
  const c = fbConfig(); if (!c) throw new Error('nocfg');
  const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/`;
  const appM = await import(base + 'firebase-app.js');
  const dbM = await import(base + 'firebase-database.js');
  const app = appM.initializeApp(c.cfg);
  FB = { ...dbM, db: dbM.getDatabase(app) };
  return FB;
}
function errText(e) {
  const m = String(e && (e.code || e.message) || e);
  if (m === 'nocfg') return 'La modalità su due dispositivi non è ancora disponibile.';
  if (/permission|PERMISSION_DENIED/i.test(m)) return 'Firebase ha rifiutato l’accesso: controlla di aver pubblicato le regole del database.';
  if (/Failed to fetch|import|network/i.test(m)) return 'Non riesco a raggiungere Firebase: controlla la connessione a internet.';
  return 'Qualcosa è andato storto: ' + m;
}
async function cleanupRooms(F) {
  try {
    const cutoff = Date.now() - (ROOM_DAYS + 1) * 86400000;
    const q = F.query(F.ref(F.db, 'rooms'), F.orderByChild('createdAt'), F.endAt(cutoff));
    const snap = await F.get(q);
    const jobs = []; snap.forEach(ch => { jobs.push(F.remove(ch.ref)); });
    await Promise.all(jobs);
  } catch (e) { console.warn('Pulizia stanze non riuscita', e); }
}
async function freeCode(F) {
  for (let k = 0; k < 15; k++) {
    const code = String(10000 + rnd(90000));
    const s = await F.get(F.ref(F.db, 'rooms/' + code));
    if (!s.exists()) return code;
  }
  throw new Error('Non trovo un codice libero, riprova.');
}

/* ---------- collegamento: stesso PC oppure Firebase ---------- */
class LocalLink {
  open(cb) {
    this.cb = cb;
    this.h = e => { if (e.key === LS_LOCAL) cb(lsGet(LS_LOCAL, null)); };
    addEventListener('storage', this.h);
    cb(lsGet(LS_LOCAL, null));
  }
  patch(p) { const s = lsGet(LS_LOCAL, null) || {}; Object.assign(s, p); lsSet(LS_LOCAL, s); this.cb(s); return Promise.resolve(); }
  presence() {}
  destroy() { localStorage.removeItem(LS_LOCAL); return Promise.resolve(); }
  close() { removeEventListener('storage', this.h); }
}
class FbLink {
  constructor(code) { this.code = code; }
  async open(cb) {
    const F = this.F = await fb();
    this.ref = F.ref(F.db, 'rooms/' + this.code);
    this.unsub = F.onValue(this.ref, s => cb(s.val()), e => { S.ui.err = errText(e); render(); });
  }
  patch(p) { return this.F.update(this.ref, p); }
  async presence(role) {
    const F = this.F, r = F.ref(F.db, `rooms/${this.code}/peers/${role}`);
    this.pr = r;
    await F.onDisconnect(r).remove();
    await F.set(r, true);
  }
  destroy() { return this.F.remove(this.ref); }
  close() { try { this.unsub && this.unsub(); if (this.pr) { this.F.onDisconnect(this.pr).cancel(); this.F.remove(this.pr).catch(() => {}); } } catch {} }
}

function normRoom(st) {
  const r = { ...st };
  r.cards = arr(st.cards); r.hand = arr(st.hand); r.pile = arr(st.pile); r.clues = arr(st.clues);
  const f = arr(st.fl), s = arr(st.sel);
  r.fl = zeros().map((_, i) => +f[i] || 0);
  r.sel = zeros().map((_, i) => +s[i] || 0);
  r.round = +st.round || 1; r.hit = st.hit == null ? -1 : +st.hit;
  r.peers = st.peers || {};
  return r;
}

/* ---------- logica di gioco ---------- */
function deal(list) {
  const d = shuffle(list.map(clean).filter(c => c.n));
  return { cards: d.slice(0, 12), hand: d.slice(12, 17), pile: d.slice(17), sx: encS(rnd(12)), clues: [], round: 1, phase: 'clue', fl: zeros(), sel: zeros(), hit: -1, deal: Date.now() };
}
function push(p) {
  Object.assign(S.room, p);
  S.room = normRoom(S.room);
  render();
  S.t.patch(p).catch(e => flash(errText(e)));
}
const roundInfo = r => {
  const need = NEED[r.round - 1] || 1;
  const done = r.fl.filter(x => x === r.round).length;
  const nSel = r.sel.filter(Boolean).length;
  return { need, done, nSel, left: need - done };
};
function selectCard(i) {
  const r = S.room; if (r.phase !== 'flip' || r.fl[i] || r.sel[i]) return;
  const { left, nSel } = roundInfo(r);
  if (nSel >= left) { flash(left === 1 ? 'Potete selezionare una sola carta: giratela o annullate la selezione.' : `Potete selezionare al massimo ${left} carte: giratele o annullate la selezione.`); return; }
  const sel = r.sel.slice(); sel[i] = 1; push({ sel });
}
function flipCard(i) {
  const r = S.room; if (r.phase !== 'flip' || !r.sel[i] || r.fl[i]) return;
  const sel = r.sel.slice(); sel[i] = 0;
  const fl = r.fl.slice(); fl[i] = r.round;
  if (i === decS(r.sx)) { push({ fl, sel: zeros(), phase: 'lost', hit: i }); return; }
  const need = NEED[r.round - 1];
  if (fl.filter(x => x === r.round).length >= need) {
    if (r.round >= 5) { push({ fl, sel: zeros(), phase: 'won' }); return; }
    const hand = r.hand.slice(), pile = r.pile.slice();
    if (pile.length) hand.push(pile.shift());
    push({ fl, sel: zeros(), round: r.round + 1, phase: 'clue', hand, pile });
  } else push({ fl, sel });
}
function playClue(k) {
  const r = S.room, i = S.ui.hand;
  if (r.phase !== 'clue' || i == null || !r.hand[i]) return;
  const hand = r.hand.slice(); const [c] = hand.splice(i, 1);
  const clues = r.clues.map(clean).map((x, j) => ({ ...x, k: r.clues[j].k })).concat([{ ...clean(c), k }]);
  S.ui.hand = null;
  push({ hand, clues, phase: 'flip', sel: zeros() });
}
function newGame() {
  const r = S.room;
  const all = [...r.cards, ...r.hand, ...r.pile, ...r.clues].map(clean);
  S.ui.hand = null; S.ui.menu = false; S.ui.confirmExit = false;
  push(deal(all));
}

/* ---------- sessione ---------- */
function setHash(h) { history.replaceState(null, '', h ? '#' + h : location.pathname + location.search); }
function saveSession() { try { sessionStorage.setItem(SS_SES, JSON.stringify(S.session)); } catch {} }
async function enterGame(session) {
  S.session = session; saveSession();
  setHash(session.mode === 'local' ? 'locale=' + session.role : `stanza=${session.code}&ruolo=${session.role}`);
  S.view = 'game'; S.room = null; S.loaded = false; S.ui.err = ''; S.ui.hideWait = false; S.ui.menu = false; S.ui.confirmExit = false; S.ui.hand = null;
  render();
  try {
    S.t = session.mode === 'local' ? new LocalLink() : new FbLink(session.code);
    await S.t.open(st => {
      if (!st) {
        if (S.loaded) { goHome(session.mode === 'local' ? 'La partita su questo PC è stata chiusa.' : 'La partita è stata chiusa.'); }
        else { S.ui.err = session.mode === 'local' ? 'Nessuna partita aperta su questo PC. Avviala dalla pagina iniziale.' : 'Stanza non trovata: controlla il codice.'; render(); }
        return;
      }
      const prev = S.room && S.room.deal;
      S.room = normRoom(st); S.loaded = true;
      if (prev && prev !== S.room.deal) S.ui.hand = null;
      render();
    });
    if (session.mode === 'fb') await S.t.presence(session.role);
  } catch (e) { S.ui.err = errText(e); render(); }
}
function goHome(msg = '') {
  try { S.t && S.t.close(); } catch {}
  S.t = null; S.session = null; S.room = null; S.loaded = false;
  try { sessionStorage.removeItem(SS_SES); } catch {}
  setHash(''); S.view = 'home'; S.ui.menu = false; S.ui.confirmExit = false;
  S.ui.msg = msg; S.ui.msgOk = false;
  render();
}
async function exitGame() {
  const t = S.t;
  try { if (t) { t.close(); await t.destroy(); } } catch (e) { console.warn(e); }
  S.t = null; goHome();
}

async function startGame() {
  const p = S.pref, d = deckById(p.deck);
  if (!d) return setMsg('Scegli un mazzo.');
  let syncFail = false;
  if (d.src) {
    S.ui.busy = true; setMsg('Aggiorno il mazzo dal Foglio Google…', true);
    try { const fresh = rowsToCards(await fetchSheet(d.src)); if (fresh.length) { d.cards = fresh; d.synced = Date.now(); saveDecks(); } }
    catch { syncFail = true; }
    S.ui.busy = false; S.ui.msg = '';
  }
  const cards = d.cards.map(clean).filter(c => c.n);
  if (cards.length < MIN_CARDS) return setMsg(`Il mazzo «${d.name}» ha ${cards.length} carte: ne servono almeno ${MIN_CARDS}.`);
  const st = { v: 1, deckName: d.name, ...deal(cards) };
  if (p.mode === 'local' || !fbConfig()) {
    st.code = 'locale'; st.createdAt = Date.now();
    try { lsSet(LS_LOCAL, st); } catch { return setMsg('Spazio esaurito in questo browser: il mazzo ha troppe immagini caricate.'); }
    S.ui.opened = false;
    await enterGame({ mode: 'local', role: p.role });
    if (syncFail) flash('Non riesco a leggere il Foglio Google: uso l’ultima copia del mazzo.');
    return;
  }
  S.ui.busy = true; setMsg('Creo la stanza…', true);
  try {
    const F = await fb();
    await cleanupRooms(F);
    const code = await freeCode(F);
    st.code = code; st.createdAt = F.serverTimestamp();
    await F.set(F.ref(F.db, 'rooms/' + code), st);
    S.ui.busy = false; S.ui.msg = '';
    enterGame({ mode: 'fb', code, role: p.role });
  } catch (e) { S.ui.busy = false; setMsg(errText(e)); }
}
async function joinGame(code, role) {
  code = String(code || '').replace(/\D/g, '');
  if (code.length !== 5) return setMsg('Il codice della stanza ha 5 cifre.');
  if (role) { S.ui.joinAsk = null; return enterGame({ mode: 'fb', code, role }); }
  S.ui.busy = true; setMsg('Cerco la stanza…', true);
  try {
    const F = await fb();
    const s = await F.get(F.ref(F.db, 'rooms/' + code));
    S.ui.busy = false;
    if (!s.exists()) return setMsg('Stanza non trovata: controlla il codice.');
    const peers = (s.val() && s.val().peers) || {};
    if (peers.lim && !peers.sugg) return joinGame(code, 'sugg');
    if (peers.sugg && !peers.lim) return joinGame(code, 'lim');
    S.ui.joinAsk = code; S.ui.msg = ''; render();
  } catch (e) { S.ui.busy = false; setMsg(errText(e)); }
}
function joinUrl(code) { return location.origin + location.pathname + '#entra=' + code; }

/* ---------- importazione mazzi ---------- */
function parseCSV(txt) {
  txt = txt.replace(/^﻿/, '');
  const first = txt.split(/\r?\n/)[0] || '';
  const cnt = ch => first.split(ch).length - 1;
  const d = [';', ',', '\t'].sort((a, b) => cnt(b) - cnt(a))[0];
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < txt.length; i++) {
    const c = txt[i];
    if (q) {
      if (c === '"') { if (txt[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === d) { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && txt[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
function rowsToCards(rows) {
  rows = rows.map(r => (r || []).map(c => String(c ?? '').trim())).filter(r => r.some(Boolean));
  if (!rows.length) return [];
  const isUrl = v => /^(https?:\/\/|data:image)/i.test(v || '');
  const hdr = rows[0].map(c => c.toLowerCase());
  const hn = hdr.findIndex(c => /^(nome|nomi|name|carta|carte|testo|parola|parole|personaggio|personaggi|titolo)$/.test(c));
  const hi = hdr.findIndex(c => /^(immagine|immagini|image|img|foto|url|link|figura)$/.test(c));
  let ni = 0, ii = -1, start = 0;
  if (hn >= 0 || hi >= 0) { start = 1; ni = hn >= 0 ? hn : (hi === 0 ? 1 : 0); ii = hi; }
  else { const k = rows.slice(0, 6).reduce((a, r) => a < 0 ? r.findIndex((c, j) => j > 0 && isUrl(c)) : a, -1); ii = k; }
  const out = [];
  for (const r of rows.slice(start)) {
    const n = (r[ni] || '').trim(); if (!n || isUrl(n)) continue;
    const img = ii >= 0 ? safeImg(r[ii]) : '';
    out.push(img ? { n, img } : { n });
  }
  return out;
}
let XLSXP = null;
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function loadXLSX() {
  if (window.XLSX) return window.XLSX;
  if (!XLSXP) XLSXP = loadScript('https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js')
    .catch(() => loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'));
  await XLSXP; return window.XLSX;
}
async function readTable(file) {
  const name = file.name.toLowerCase();
  const buf = await file.arrayBuffer();
  if (/\.(xlsx|xlsm|xls|ods)$/.test(name)) {
    const X = await loadXLSX();
    const wb = X.read(buf, { type: 'array' });
    return X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '', raw: false });
  }
  let txt;
  try { txt = new TextDecoder('utf-8', { fatal: true }).decode(buf); } catch { txt = new TextDecoder('windows-1252').decode(buf); }
  return parseCSV(txt);
}
function sheetUrls(u) {
  u = u.trim();
  const gid = (u.match(/[#&?]gid=(\d+)/) || [])[1];
  let m = u.match(/\/spreadsheets\/d\/e\/([\w-]+)/);
  if (m) return [`https://docs.google.com/spreadsheets/d/e/${m[1]}/pub?output=csv${gid ? '&gid=' + gid : ''}`];
  m = u.match(/\/spreadsheets\/d\/([\w-]+)/);
  if (m) return [`https://docs.google.com/spreadsheets/d/${m[1]}/gviz/tq?tqx=out:csv${gid ? '&gid=' + gid : ''}`, `https://docs.google.com/spreadsheets/d/${m[1]}/export?format=csv${gid ? '&gid=' + gid : ''}`];
  return /^https?:\/\//.test(u) ? [u] : [];
}
async function fetchSheet(u) {
  const urls = sheetUrls(u);
  if (!urls.length) throw new Error('Il link non sembra un Foglio Google.');
  for (const url of urls) {
    try {
      const r = await fetch(url); if (!r.ok) continue;
      const t = await r.text();
      if (/^\s*<(!doctype|html)/i.test(t)) continue;
      return parseCSV(t);
    } catch {}
  }
  throw new Error('Non riesco a leggere il foglio. Condividilo con «Chiunque abbia il link» (lettore) oppure pubblicalo sul web (File › Condividi › Pubblica sul web).');
}
function fileToDataUrl(file, max = 480) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const im = new Image();
      im.onload = () => {
        const s = Math.min(1, max / Math.max(im.width, im.height));
        const c = document.createElement('canvas'); c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
        const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.8));
      };
      im.onerror = () => rej(new Error('Immagine non valida'));
      im.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}
function exportCSV(d) {
  const q = v => /[",;\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  const txt = 'nome,immagine\n' + d.cards.map(c => q(c.n) + ',' + q(c.img || '')).join('\n');
  downloadText((d.name.replace(/[^\w\-àèéìòù ]+/gi, '').trim() || 'mazzo') + '.csv', txt);
}

/* ---------- QR ---------- */
let QRP = null; const qrCache = {};
async function fillQRs() {
  const els = document.querySelectorAll('[data-qr]'); if (!els.length) return;
  try {
    if (!window.qrcode) { if (!QRP) QRP = loadScript('https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js'); await QRP; }
    els.forEach(el => {
      const u = el.dataset.qr;
      if (!qrCache[u]) { const q = window.qrcode(0, 'M'); q.addData(u); q.make(); qrCache[u] = q.createSvgTag(4, 2); }
      if (!el.innerHTML) el.innerHTML = qrCache[u];
    });
  } catch { els.forEach(el => { el.style.display = 'none'; }); }
}

    ${S.ui.msg ? `<div class="msg ${S.ui.msgOk ? 'ok' : ''}" role="status">${esc(S.ui.msg)}</div>` : ''}
    <div class="cardrows">${rows || '<p class="muted">Il mazzo è vuoto.</p>'}</div>
  </section>
</div>`;
}

/* ---------- LIM ---------- */
function clueCard(c, k = 1) {
  const img = c.img ? `<img class="cimg" src="${esc(c.img)}" alt="">` : '';
  return `<div class="cc ${c.k === 'd' ? 'h' : 'v'}" data-fit>${img}${nameSpan(c.n, (c.img ? 0.55 : 0.72) * k)}</div>`;
}
function chips(list) {
  return list.map(c => `<span class="chip">${c.k === 'd' ? ICO_V('#0D2A23', 16, 11) : ICO_V()}${esc(c.n)}<span class="sr">${c.k === 'd' ? ' (diversa)' : ' (simile)'}</span></span>`).join('');
}
function limCard(c, i, r, sec) {
  const num = pad(i + 1), ph = r.phase;
  const img = c.img ? `<img class="cimg" src="${esc(c.img)}" alt="">` : '';
  const nm = nameSpan(c.n, c.img ? 0.68 : 1);
  if (ph === 'lost' && i === r.hit) return `<div class="card hit" data-fit><span class="tag">ERA LA SEGRETA</span><span class="cbody">${img}${nm}</span></div>`;
  if (r.fl[i]) return `<div class="cardout dots"><span class="mono">${num} · girata</span></div>`;
  if (ph === 'won' && i === sec) return `<div class="card hit" data-fit><span class="tag">LA SEGRETA</span><span class="cbody">${img}${nm}</span></div>`;
  if (r.sel[i]) return `<button class="card sel" data-fit data-act="flip" data-i="${i}" aria-label="${esc(c.n)}: selezionata. Tocca di nuovo per girarla"><span class="cnum" aria-hidden="true">${num}</span><span class="stamp" aria-hidden="true">GIRA</span><span class="cbody">${img}${nm}</span></button>`;
  return `<button class="card" data-fit data-act="sel" data-i="${i}" ${ph === 'flip' ? '' : 'disabled'} aria-label="${esc(c.n)}"><span class="cnum" aria-hidden="true">${num}</span><span class="cbody">${img}${nm}</span></button>`;
}
function statusChip() {
  const s = S.session, r = S.room;
  if (s.mode === 'local') return `<span class="chipc mono"><span class="dot on"></span>stesso PC</span>`;
  const other = s.role === 'lim' ? 'sugg' : 'lim';
  const on = !!(r && r.peers && r.peers[other]);
  return `<span class="chipc mono" title="${on ? 'Altro dispositivo collegato' : 'Altro dispositivo non collegato'}"><span class="dot ${on ? 'on' : ''}"></span>stanza ${esc(s.code)}<span class="sr">${on ? ', collegato' : ', in attesa'}</span></span>`;
}
function endButtons() {
  return `<div class="endb"><button class="btn or" data-act="newGame">Nuova partita</button><button class="btn ghost" data-act="menu">Menu</button></div>`;
}
function vLim() {
  const r = S.room, s = S.session, sec = decS(r.sx), ph = r.phase;
  const { need, done, nSel } = roundInfo(r);
  const last = r.clues[r.clues.length - 1];
  const secName = r.cards[sec] ? r.cards[sec].n : '';
  const sqs = [1, 2, 3, 4, 5].map(k => `<span class="sq ${k < r.round || (ph === 'won') ? 'done' : ''} ${k === r.round && ph !== 'won' ? 'cur' : ''}"></span>`).join('');
  let box;
  if (ph === 'clue') box = `<div class="cluebox"><span class="mono lbl">indizio del turno ${r.round}</span><div class="slotc mono">il suggeritore sta scegliendo…</div></div>`;
  else if (last) box = `<div class="cluebox"><span class="mono lbl">${ph === 'flip' ? 'l’indizio di questo turno' : 'ultimo indizio'}</span>${clueCard(last)}<span class="mono kchip">${last.k === 'd' ? 'SDRAIATA = DIVERSA' : 'IN PIEDI = SIMILE'}</span></div>`;
  else box = '';
  const prevList = ph === 'clue' ? r.clues : r.clues.slice(0, -1);
  const prev = prevList.length ? `<div class="prev"><span class="mono lbl">indizi precedenti</span><div class="chips">${chips(prevList)}</div></div>` : '';
  let foot = '';
  if (ph === 'flip') {
    const slots = Array.from({ length: need }, (_, k) => `<span class="${k < done ? 'f' : k < done + nSel ? 's' : ''}"></span>`).join('');
    foot = `<div class="big">Girate <span class="or">${done}</span> di ${need}</div>
      <div class="mono hint">${S.ui.flash ? esc(S.ui.flash) : nSel ? 'tocca di nuovo per girare le carte arancio' : 'tocca una carta per selezionarla'}</div>
      <div class="slots" style="grid-template-columns:repeat(${need},minmax(0,1fr))" aria-hidden="true">${slots}</div>`;
  } else if (ph === 'clue') {
    foot = `<div class="big sm">In attesa dell’indizio</div><div class="mono hint">poi girerete ${need} ${need === 1 ? 'carta' : 'carte'}</div>`;
  } else if (ph === 'won') {
    foot = `<div class="big or">Avete vinto!</div><div class="mono hint">la carta segreta era ${esc(secName)}</div>${endButtons()}`;
  } else if (ph === 'lost') {
    foot = `<div class="big or">Carta segreta girata!</div><div class="mono hint">partita persa · era ${esc(secName)}</div>${endButtons()}`;
  }
  let wait = '';
  if (!S.ui.hideWait) {
    if (s.mode === 'fb' && !r.peers.sugg) {
      const u = joinUrl(s.code);
      wait = `<div class="wait"><div class="waitbox"><div><h3>Collega il suggeritore</h3><ol><li>Sul telefono apri questo sito, oppure inquadra il QR</li><li>Tocca «Entra in una partita»</li><li>Scrivi il codice</li></ol><div class="bigcode">${esc(s.code)}</div><div class="row" style="margin-top:12px"><button class="btn sm ink" data-act="hideWait">Nascondi</button></div></div><div class="qr" data-qr="${esc(u)}" role="img" aria-label="QR per entrare nella stanza"></div></div></div>`;
    } else if (s.mode === 'local' && !window.opener && !S.ui.opened) {
      wait = `<div class="wait"><div class="waitbox"><div><h3>Apri la finestra del suggeritore</h3><p style="font-size:18px;margin:0 0 14px">Si apre sul tuo schermo; questa finestra resta sulla LIM. Usa il menu per lo schermo intero.</p><div class="row"><button class="btn or" data-act="openOther">Apri la finestra del suggeritore</button><button class="btn sm ink" data-act="hideWait">Nascondi</button></div></div></div></div>`;
    }
  }
  return `<div class="limwrap"><div id="stage">
  <header class="lhead">
    <div class="lhl">
      <div class="brand">${LOGO(48)}<span class="title">SOMIGLIANZE</span></div>
      <div class="clr">${ph === 'flip' && nSel ? `<button class="clearbtn mono" data-act="clearSel">${ICO_X}Annulla selezione</button>` : ''}</div>
    </div>
    <div class="lhr">${statusChip()}<button class="menubtn mono" data-act="menu">menu</button></div>
  </header>
  <div class="lmain">
    <div class="lgrid">${r.cards.map((c, i) => limCard(c, i, r, sec)).join('')}${wait}</div>
    <aside class="laside" aria-live="polite">
      <div class="turn"><b>${ph === 'won' || ph === 'lost' ? 'Fine partita' : `Turno ${r.round} di 5`}</b><div class="sqs" aria-hidden="true">${sqs}</div></div>
      ${box}${prev}
      <div class="lfoot">${foot}</div>
    </aside>
  </div>
</div></div>`;
}

/* ---------- Suggeritore ---------- */
function vSugg() {
  const r = S.room, s = S.session, sec = decS(r.sx), ph = r.phase;
  const { need, done, nSel } = roundInfo(r);
  const sc = r.cards[sec] || { n: '?' };
  let banner = '';
  if (s.mode === 'fb' && !r.peers.lim && !S.ui.hideWait) {
    banner = `<div class="banner"><div style="flex:1"><p><b>Collega la LIM</b>: apri il sito sulla LIM, tocca «Entra in una partita» e scrivi</p><div class="bigcode" style="font-size:34px">${esc(s.code)}</div><button class="lnk" data-act="hideWait">Nascondi</button></div><div class="qr sm" data-qr="${esc(joinUrl(s.code))}" role="img" aria-label="QR per entrare nella stanza"></div></div>`;
  } else if (s.mode === 'local' && !window.opener && !S.ui.opened && !S.ui.hideWait) {
    banner = `<div class="banner"><div style="flex:1"><p><b>Apri la finestra della LIM</b>, poi trascinala sulla LIM e mettila a schermo intero dal suo menu.</p><div class="row"><button class="btn sm or" data-act="openOther">Apri la finestra della LIM</button><button class="lnk" data-act="hideWait">Nascondi</button></div></div></div>`;
  }
  let main = '';
  if (ph === 'clue') {
    const hs = r.hand.map((c, i) => `<button class="hcard ${c.img ? 'wimg' : ''}" data-fit data-act="hand" data-i="${i}" aria-pressed="${S.ui.hand === i}">${c.img ? `<img class="cimg" src="${esc(c.img)}" alt="">` : ''}${nameSpan(c.n, c.img ? 0.55 : 0.7)}</button>`).join('');
    const dis = S.ui.hand == null ? 'disabled' : '';
    main = `<div class="sect mono">turno ${r.round} · scegli una carta dalla tua mano</div>
      <div class="hand">${hs}${r.hand.length % 2 ? `<div class="hinfo mono">poi la classe girerà ${need} ${need === 1 ? 'carta' : 'carte'}</div>` : ''}</div>
      <div class="kinds">
        <button class="btn or kind" data-act="clue" data-k="s" ${dis}>${ICO_V('#0D2A23', 22, 32)}Gioca simile</button>
        <button class="btn ink kind" data-act="clue" data-k="d" ${dis}>${ICO_V('#0D2A23', 32, 22)}Gioca diversa</button>
      </div>`;
  } else if (ph === 'flip') {
    main = `<div class="sbox"><div class="big sm">La classe sta girando</div><div class="mono hint">girate ${done} di ${need} · selezionate ${nSel}</div></div>`;
  } else {
    main = `<div class="sbox"><div class="big or">${ph === 'won' ? 'La classe ha vinto!' : 'Carta segreta girata!'}</div><div class="mono hint">${ph === 'won' ? 'resta solo la carta segreta' : 'partita persa'}</div>${endButtons()}</div>`;
  }
  const board = r.cards.map((c, i) => {
    const num = pad(i + 1);
    if (r.fl[i] && !(ph === 'lost' && i === r.hit)) return `<div class="mc out dots"><span class="mn">${num}</span><span class="sr">${esc(c.n)}, girata</span></div>`;
    const cls = i === sec ? 'sec' : r.sel[i] ? 'sel' : '';
    return `<div class="mc ${cls} ${r.sel[i] && i === sec ? 'sel' : ''}" data-fit><span class="mn">${i === sec ? 'segreta' : num}</span>${nameSpan(c.n, 0.42)}${r.sel[i] ? '<span class="sr">, selezionata</span>' : ''}</div>`;
  }).join('');
  return `<div class="sg">
  <header class="sghead"><div style="display:flex;align-items:center;gap:10px">${LOGO(34)}<span class="title">SOMIGLIANZE</span></div><button class="menubtn mono" data-act="menu">menu</button></header>
  <div class="sgstat mono">${s.mode === 'local' ? 'stesso PC' : `<span class="dot ${r.peers.lim ? 'on' : ''}"></span>stanza ${esc(s.code)}${r.peers.lim ? ' · LIM collegata' : ' · LIM non collegata'}`} · ${ph === 'won' || ph === 'lost' ? 'fine partita' : `turno ${r.round}/5`}</div>
  ${banner}
  <div class="secret">${sc.img ? `<img class="simg" src="${esc(sc.img)}" alt="">` : ''}<div style="min-width:0"><span class="lbl mono">la tua carta segreta · n. ${pad(sec + 1)}</span><span class="snm">${esc(sc.n)}</span></div></div>
  ${main}
  <div class="sect mono">il tavolo</div>
  <div class="mboard">${board}</div>
  ${r.clues.length ? `<div class="sect mono">indizi giocati</div><div class="chips">${chips(r.clues)}</div>` : ''}
  ${S.ui.flash ? `<div class="msg" role="status">${esc(S.ui.flash)}</div>` : ''}
</div>`;
}

function vMenu() {
  const r = S.room;
  return `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-t"><div class="modalbox">
    <h2 id="m-t">Come si gioca</h2>
    <ul>${RULES_HTML}</ul>
    <div class="row">
      ${S.session && S.session.role === 'lim' ? '<button class="btn sm ink" data-act="fullscreen">Schermo intero</button>' : ''}
      ${r && r.phase !== 'won' && r.phase !== 'lost' ? '<button class="btn sm ink" data-act="newGame">Ricomincia con nuove carte</button>' : ''}
      ${S.session && S.session.mode === 'local' ? '<button class="btn sm ink" data-act="openOther">Apri l’altra finestra</button>' : ''}
    </div>
    <div class="row" style="margin-top:16px">
      ${S.ui.confirmExit ? `<button class="btn sm or" data-act="exit">Sì, chiudi la partita</button><button class="lnk" data-act="noExit">Annulla</button><span class="muted" style="flex-basis:100%;font-size:15px">La partita si chiude anche sull’altro schermo.</span>`
        : '<button class="btn sm ink" data-act="askExit">Chiudi la partita</button>'}
      <button class="btn sm or" data-act="closeMenu" style="margin-left:auto">Torna al gioco</button>
    </div>
  </div></div>`;
}

function vGame() {
  if (S.ui.err) return `<div class="center"><div class="panel" style="max-width:520px"><h2>Ops</h2><p>${esc(S.ui.err)}</p><div class="row"><button class="btn or" data-act="home">Torna alla pagina iniziale</button></div></div></div>`;
  if (!S.room) return `<div class="center mono" role="status">Collegamento alla partita…</div>`;
  return (S.session.role === 'lim' ? vLim() : vSugg()) + (S.ui.menu ? vMenu() : '');
}

/* ---------- render ---------- */
function render() {
  const keep = document.activeElement && document.activeElement.id;
  const html = S.view === 'home' ? vHome() : S.view === 'decks' ? vDecks() : S.view === 'edit' ? vEdit() : S.view === 'guide' ? vGuide() : vGame();
  $app.innerHTML = html;
  document.body.style.overflow = (S.view === 'game' && S.session && S.session.role === 'lim') ? 'hidden' : '';
  if (keep) { const el = document.getElementById(keep); if (el && el.tagName === 'INPUT') el.focus(); }
  layoutStage(); fitAll(); fillQRs();
  if (S.ui.anchor) { const a = document.getElementById(S.ui.anchor); S.ui.anchor = null; if (a) a.scrollIntoView(); }
}
function layoutStage() {
  const st = document.getElementById('stage'); if (!st) return;
  const s = Math.min(innerWidth / 1280, innerHeight / 720);
  st.style.transform = `scale(${s})`;
  st.style.left = Math.max(0, (innerWidth - 1280 * s) / 2) + 'px';
  st.style.top = Math.max(0, (innerHeight - 720 * s) / 2) + 'px';
}
addEventListener('resize', () => { layoutStage(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fitAll());

/* ---------- azioni ---------- */
async function syncDeck(d) {
  if (!d || !d.src) return;
  setMsg('Aggiorno il mazzo dal Foglio Google…', true);
  try {
    const fresh = rowsToCards(await fetchSheet(d.src));
    if (!fresh.length) return setMsg('Nel foglio non ho trovato carte.');
    d.cards = fresh; d.synced = Date.now();
    if (saveDecks()) setMsg(`Mazzo aggiornato: ${fresh.length} carte.`, true);
  } catch (e) { setMsg(e.message); }
}
const ACT = {
  go: b => { S.view = b.dataset.v; S.ui.msg = ''; S.ui.gsOpen = false; S.ui.delAsk = null; S.ui.wipeAsk = false; render(); scrollTo(0, 0); },
  guide: b => { S.view = 'guide'; S.ui.msg = ''; S.ui.anchor = b && b.dataset.anchor || null; render(); if (!S.ui.anchor && !(b && b.dataset.anchor)) scrollTo(0, 0); },
  jump: b => { const a = document.getElementById(b.dataset.anchor); if (a) a.scrollIntoView({ behavior: 'smooth' }); },
  home: () => goHome(),
  pick: b => { S.pref[b.dataset.k] = b.dataset.v; S.ui.msg = ''; savePref(); render(); },
  start: () => startGame(),
  join: () => { const el = document.getElementById('joinCode'); joinGame(el ? el.value : ''); },
  joinAs: b => joinGame(S.ui.joinAsk, b.dataset.v),
  joinCancel: () => { S.ui.joinAsk = null; render(); },
  template: () => downloadText('somiglianze-modello.csv', 'nome,immagine\nCristoforo Colombo,\nMarie Curie,\n'),
  pickFile: b => { const el = document.getElementById(b.dataset.for); if (el) el.click(); },
  newDeck: () => { const d = { id: uid(), name: 'Nuovo mazzo', cards: [], temp: S.pref.keep === 'lesson' }; S.decks.push(d); saveDecks(); S.editId = d.id; S.view = 'edit'; S.ui.msg = ''; S.ui.gsOpen = false; render(); scrollTo(0, 0); },
  goSheet: () => { S.view = 'decks'; S.ui.gsOpen = true; S.ui.msg = ''; render(); const el = document.getElementById('gsUrl'); el && el.focus(); },
  edit: b => { S.editId = b.dataset.id; S.view = 'edit'; S.ui.msg = ''; S.ui.gsOpen = false; render(); scrollTo(0, 0); },
  export: b => { const d = deckById(b.dataset.id); if (d) exportCSV(d); },
  delAsk: b => { S.ui.delAsk = b.dataset.id; render(); },
  delDeck: b => { S.decks = S.decks.filter(d => d.id !== b.dataset.id); S.ui.delAsk = null; saveDecks(); render(); },
  toggleTemp: b => { const d = deckById(b.dataset.id); if (!d) return; d.temp = !d.temp; if (saveDecks()) setMsg(d.temp ? `«${d.name}» resta solo per questa lezione.` : `«${d.name}» è salvato su questo dispositivo.`, true); },
  syncDeck: b => syncDeck(deckById(b.dataset.id)),
  unlink: b => { const d = deckById(b.dataset.id); if (!d) return; delete d.src; if (saveDecks()) setMsg('Mazzo scollegato dal foglio: ora puoi modificarlo qui.', true); },
  wipeAsk: () => { S.ui.wipeAsk = true; render(); },
  wipeNo: () => { S.ui.wipeAsk = false; render(); },
  wipe: () => { wipeAll(); S.ui.wipeAsk = false; S.view = 'home'; setMsg('Fatto: in questo browser non resta nessun mazzo.', true); scrollTo(0, 0); },
  gsToggle: () => { S.ui.gsOpen = !S.ui.gsOpen; render(); if (S.ui.gsOpen) { const el = document.getElementById('gsUrl'); el && el.focus(); } },
  importSheet: async b => {
    const el = document.getElementById('gsUrl'); const target = (b && b.dataset.target) || (el && el.dataset.target);
    const u = el ? el.value.trim() : ''; if (!u) return;
    const lk = document.getElementById('gsLink'); const link = target === 'newDeck' && (!lk || lk.checked);
    S.ui.gsLink = !lk || lk.checked;
    setMsg('Leggo il foglio…', true);
    try { const cards = rowsToCards(await fetchSheet(u)); addImported(cards, target, 'Mazzo da Foglio Google', null, link ? u : null); }
    catch (e) { setMsg(e.message); }
  },
  addCard: () => {
    const d = deckById(S.editId); const n = document.getElementById('addN'), im = document.getElementById('addImg');
    const name = n.value.trim(); if (!name) { n.focus(); return; }
    const img = S.ui.addImgData || safeImg(im.value);
    d.cards.push(img ? { n: name, img } : { n: name }); S.ui.addImgData = null;
    if (saveDecks()) S.ui.msg = '';
    render(); const nn = document.getElementById('addN'); nn && nn.focus();
  },
  delCard: b => { const d = deckById(S.editId); d.cards.splice(+b.dataset.i, 1); saveDecks(); render(); },
  sel: b => selectCard(+b.dataset.i),
  flip: b => flipCard(+b.dataset.i),
  clearSel: () => push({ sel: zeros() }),
  hand: b => { const i = +b.dataset.i; S.ui.hand = S.ui.hand === i ? null : i; render(); },
  clue: b => playClue(b.dataset.k),
  newGame: () => newGame(),
  menu: () => { S.ui.menu = true; S.ui.confirmExit = false; render(); },
  closeMenu: () => { S.ui.menu = false; render(); },
  askExit: () => { S.ui.confirmExit = true; render(); },
  noExit: () => { S.ui.confirmExit = false; render(); },
  exit: () => exitGame(),
  hideWait: () => { S.ui.hideWait = true; render(); },
  openOther: () => { S.ui.menu = false; openOther(); },
  fullscreen: () => { S.ui.menu = false; render(); const el = document.documentElement; (el.requestFullscreen ? el.requestFullscreen() : Promise.reject()).catch(() => flash('Schermo intero non disponibile: usa il tasto F11.')); },
};
function addImported(cards, target, fallbackName, fileName, src) {
  if (!cards.length) return setMsg('Non ho trovato carte: serve una colonna con i nomi.');
  if (target === 'appendDeck') {
    const d = deckById(S.editId); d.cards.push(...cards);
    if (saveDecks()) setMsg(`Aggiunte ${cards.length} carte.`, true);
  } else {
    const d = { id: uid(), name: (fileName || fallbackName).replace(/\.[^.]+$/, ''), cards, temp: S.pref.keep === 'lesson' };
    if (src) { d.src = src; d.synced = Date.now(); }
    S.decks.push(d);
    if (saveDecks()) { S.editId = d.id; S.view = 'edit'; S.ui.gsOpen = false; setMsg(`Importate ${cards.length} carte. Controlla i nomi e dai un nome al mazzo.`, true); scrollTo(0, 0); }
  }
}

$app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const f = ACT[b.dataset.act]; if (f) f(b, e);
});
$app.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'gsLink') { S.ui.gsLink = t.checked; return; }
  if (t.dataset.edit) {
    const d = deckById(S.editId); if (!d) return;
    if (t.dataset.edit === 'name') { d.name = t.value.trim() || 'Senza nome'; saveDecks(); return; }
    const c = d.cards[+t.dataset.i]; if (!c) return;
    if (t.dataset.edit === 'n') { const v = t.value.trim(); if (v) c.n = v; else t.value = c.n; }
    if (t.dataset.edit === 'img') { const v = safeImg(t.value); if (v) c.img = v; else if (!t.value.trim()) delete c.img; }
    saveDecks(); if (t.dataset.edit === 'img') render();
    return;
  }
  if (t.type === 'file' && t.files && t.files[0]) {
    const file = t.files[0], kind = t.dataset.file;
    try {
      if (kind === 'newDeck' || kind === 'appendDeck') { setMsg('Leggo il file…', true); addImported(rowsToCards(await readTable(file)), kind, 'Mazzo importato', file.name); }
      else if (kind === 'addImg') { S.ui.addImgData = await fileToDataUrl(file); const n = document.getElementById('addN'); const keepName = n ? n.value : ''; render(); const nn = document.getElementById('addN'); if (nn) { nn.value = keepName; nn.focus(); } }
      else if (kind === 'rowImg') { const d = deckById(S.editId); d.cards[+t.dataset.i].img = await fileToDataUrl(file); saveDecks(); render(); }
    } catch (err) { setMsg('Non riesco a leggere il file: ' + (err.message || err)); }
    t.value = '';
  }
});
$app.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const id = e.target.id;
  if (id === 'addN' || id === 'addImg') { e.preventDefault(); ACT.addCard(); }
  else if (id === 'joinCode') { e.preventDefault(); ACT.join(); }
  else if (id === 'gsUrl') { e.preventDefault(); ACT.importSheet(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.ui.menu) { S.ui.menu = false; render(); } });

/* ---------- avvio ---------- */
loadDecks();
(function boot() {
  const lg = lsGet(LS_LOCAL, null);
  if (lg && (!lg.createdAt || Date.now() - lg.createdAt > LOCAL_MAX_HOURS * 3600000)) { try { localStorage.removeItem(LS_LOCAL); } catch {} }
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('locale') === 'lim' || h.get('locale') === 'sugg') return enterGame({ mode: 'local', role: h.get('locale') });
  if (fbConfig()) {
    if (h.get('stanza') && /^(lim|sugg)$/.test(h.get('ruolo') || '')) return enterGame({ mode: 'fb', code: h.get('stanza'), role: h.get('ruolo') });
    if (h.get('entra')) { setHash(''); render(); return joinGame(h.get('entra')); }
  } else if (location.hash) setHash('');
  render();
})();
</script>
